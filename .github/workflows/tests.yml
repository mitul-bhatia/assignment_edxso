name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The suite is offline: no API keys, network or database file are needed.
      - name: Run tests
        run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the reviewer workbench
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build the Vercel sandbox
        working-directory: web
        run: VITE_DEMO=1 npm run build
